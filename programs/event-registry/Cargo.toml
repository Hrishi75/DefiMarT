[package]
name = "event-registry"
version = "0.1.0"
description = "DefiMart on-chain event provenance registry"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
